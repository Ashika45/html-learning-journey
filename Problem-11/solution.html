<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>feedback form</title>
</head>
<body>
    <h1> Welcome to the feedback </h1>
    <form>
        <label for="Name">Name:</label><br>
        <input type="Name" id="Name" name="Name" required><br><br>
        <label for="Email">Email:</label><br>
        <input type="Email" id="Email" name="Email" required><br><br>

        <p>How would you rate our service?</p>
        <input type="radio" id="excellent" name="rating" value="excellent">
        <label for="excellent">Excellent</label><br />
        <input type="radio" id ="good" name="rating"  value="good">
        <label for="good"> Good </label><br/>
        <input type="radio" id="poor" name="rating" value="poor">
        <label for="poor">poor</label>

        <p>Which features do you like most?</p>
        <input type="checkbox" id="blog" name="features" value="blog">
        <label for="blog">Blog</label>
        <input type="checkbox" id="forum" name="features" value="forum">
        <label for="forum">Forum</label>
        <input type="checkbox" id="documentation" name="features" value="documentation">
        <label for="documentation">documentation</label>
        <br><br>

        <label for="suggestion">what would you like to see improved?</label><br>
        <select id="suggestion" name="suggestion">
            <option value="design">design</option>
            <option value="content">content</option>
            <option value="performance">performance</option>
            <option value="usability">usability</option>
        </select>
        <br><br>
        <label for="comments" name="comments">Additional comments:</label><br>
        <textarea id="comments" name="comments" rows="5" cols="30"></textarea><br><br>

        <button type ="submit">submit feedback</button>


  </form>
    
</body>
</html>
